version: '2.4'

# balena-compose for Menvayal Agent fleet.
#
# Single service. Hardware access via `privileged: true` (simplest for v1;
# can be tightened to explicit `devices:` + `cap_add:` later).
#
# Per-device variables (NODE_UID, AUTH_TOKEN, MQTT_BROKER, etc.) are set in
# the balena dashboard under Devices → <device> → Device Variables. Fleet-wide
# defaults go under Fleet → Variables. See BALENA.md for the full list.

services:
  agent:
    build: .
    restart: always
    privileged: true
    network_mode: host
    volumes:
      # Persisted across container updates — pin config, baseline, telemetry buffer.
      - agal-state:/var/lib/agal-agent
      # Rendered config.yaml lives here; entrypoint regenerates on start.
      - agal-config:/etc/agal-agent
    labels:
      io.balena.features.dbus: '1'
      io.balena.features.sysfs: '1'

volumes:
  agal-state:
  agal-config:
